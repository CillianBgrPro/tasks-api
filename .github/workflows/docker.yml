name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image et version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:sha-${GITHUB_SHA::7}"
          echo "Déploiement de $IMAGE"
          docker run -d --name tasks-api -p 8000:8000 "$IMAGE"

      - run: |
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8000/health; then
              echo
              curl -fs http://localhost:8000/version
              exit 0
            fi
            echo "Pas encore prêt, essai $i/10..."
            sleep 3
          done
          docker logs tasks-api
          exit 1

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:${GITHUB_REF_NAME#v}"
          echo "Déploiement de $IMAGE"
          docker run -d --name tasks-api -p 8000:8000 "$IMAGE"

      - run: |
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8000/health; then
              echo
              curl -fs http://localhost:8000/version | grep "${GITHUB_REF_NAME#v}"
              exit 0
            fi
            echo "Pas encore prêt, essai $i/10..."
            sleep 3
          done
          docker logs tasks-api
          exit 1

  update-config:
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cillianbgrpro/tasks-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push